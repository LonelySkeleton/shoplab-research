
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopLab — Каталог</title>

    <link rel="stylesheet" href="style.css">

    <script src="experiment.js" defer></script>
    <script src="tracking.js" defer></script>
    <script src="products.js" defer></script>
    <script src="pricing.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <h1>ShopLab</h1>

        <a href="cart.html" class="cart-link">
            🛒 Корзина
            (<span id="cart-count">0</span>)
        </a>
    </div>
</header>

<main class="container">
    <h2>Выберите наушники</h2>

    <p class="subtitle">
        Сравните модели, добавьте интересующие
        товары в корзину и выберите один
        для окончательного подтверждения.
    </p>

    <section
        id="products"
        class="products"
        aria-label="Каталог наушников">
    </section>
</main>

<aside id="cart-panel" class="cart-panel hidden" aria-label="Переход в корзину">
    <span role="status">Товаров в корзине: <strong id="cart-panel-count">0</strong></span>
    <a href="cart.html" class="cart-panel-link">Перейти в корзину →</a>
</aside>
</body>
</html>
